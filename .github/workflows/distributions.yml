name: Preserve fixed Javdex dependencies
on:
  workflow_dispatch:
    inputs:
      linux_llama:
        description: Preserve only Linux x64 llama b11435 GPU mirrors in a new independent release
        required: false
        default: false
        type: boolean
      artifacts_run:
        description: Optional completed run with all native build jobs successful; identical build inputs are required
        required: false
        default: ''
        type: string
permissions:
  contents: read
concurrency:
  group: fixed-distributions-20261021
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - run: npm test
  mirror:
    if: inputs.artifacts_run == ''
    needs: contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - run: node scripts/mirror.mjs ${{ inputs.linux_llama && '--linux-llama' || '' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mirrors
          path: dist/*
          if-no-files-found: error
          retention-days: 30
  mac:
    if: inputs.artifacts_run == '' && !inputs.linux_llama
    needs: contracts
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - run: brew install cmake
      - run: node scripts/package-ai.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mac-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
  ffmpeg:
    if: inputs.artifacts_run == '' && !inputs.linux_llama
    needs: contracts
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: windows-latest
            target: win32-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc make diffutils tar
          path-type: inherit
      - if: runner.os != 'Windows'
        run: node scripts/ffmpeg-build.mjs
      - if: runner.os == 'Windows'
        shell: msys2 {0}
        run: node scripts/ffmpeg-build.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ffmpeg-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
  playback:
    if: inputs.artifacts_run == '' && !inputs.linux_llama
    needs: contracts
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: windows-latest
            target: win32-x64
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - run: node scripts/archive-playback.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playback-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
  stage:
    if: always() && needs.contracts.result == 'success' && ((inputs.linux_llama && inputs.artifacts_run == '' && needs.mirror.result == 'success') || (!inputs.linux_llama && (inputs.artifacts_run != '' || (needs.mirror.result == 'success' && needs.mac.result == 'success' && needs.ffmpeg.result == 'success' && needs.playback.result == 'success'))))
    needs: [contracts, mirror, mac, ffmpeg, playback]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          path: dist
          merge-multiple: true
          run-id: ${{ inputs.artifacts_run || github.run_id }}
          github-token: ${{ github.token }}
      - run: node scripts/publish-distributions.mjs stage ${{ inputs.linux_llama && '--linux-llama' || '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          JAVDEX_BUILD_RUN: ${{ inputs.artifacts_run }}
